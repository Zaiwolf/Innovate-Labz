
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Join the Club</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="signup.css">
</head>

<body class="signup-page">

    <a href="index.html" class="back-home">← Back to home</a>

    <div class="signup-decoration blob-one"></div>
    <div class="signup-decoration blob-two"></div>
    <div class="signup-decoration blob-three"></div>

    <main class="signup-card">

        <div class="signup-symbol">✳</div>

        <p class="signup-tag">MEMBER REGISTRATION // 001</p>

        <h1>Join the <span>Club.</span></h1>

        <p class="signup-description">
            Your ideas. Your experiments. Your next big creation.
            Let's build something awesome.
        </p>

        <form id="signupForm">

            <label for="nickname">Your club nickname</label>
            <input
                type="text"
                id="nickname"
                placeholder="e.g. PixelWizard"
                required
            >

            <label for="email">Email address</label>
            <input
                type="email"
                id="email"
                placeholder="you@example.com"
                required
            >

            <label for="password">Create a password</label>
            <input
                type="password"
                id="password"
                placeholder="Create your password"
                required
            >

            <button type="submit" class="signup-submit">
                CREATE ACCOUNT <span>↗</span>
            </button>

            <p id="signupMessage"></p>

        </form>

        <p class="signup-footer">
            Already part of the club?
            <a href="login.html">Log in here</a>
        </p>

    </main>
<script type="module" src="js/signup.js"></script>
</body>
</html>
